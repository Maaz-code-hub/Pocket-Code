<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif;
         background: #f8fafc; color: #0f172a; text-align: center; padding: 0 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #4f46e5; display: grid; place-items: center; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; opacity: .75; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 22px; background: #4f46e5; color: #fff; }
</style>
</head>
<body>
  <div>
    <div class="logo"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg></div>
    <h1>You're offline</h1>
    <p>DevLocker needs internet the first time it opens.<br>After that, it opens offline with your last session.</p>
    <button onclick="location.href='https://devlocker.netlify.app/'">Try again</button>
  </div>
</body>
</html>
