plugins {
    id 'com.android.application'
}

// ---- The site this app opens. Change it here if the domain ever changes.
def siteHost = 'devlocker.netlify.app'

// Release signing: created by ../build-apk.sh (never commit these files).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'app.netlify.devlocker'
    compileSdk 34

    defaultConfig {
        applicationId 'app.netlify.devlocker'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
        buildConfigField 'String', 'SITE_HOST', "\"${siteHost}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
