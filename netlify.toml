[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "STORAGE_LIMIT_MB,SUPABASE_BUCKET,MAX_UPLOAD_MB,CACHE_TTL_HOURS,CACHE_FILE_MAX_MB,KEEP_ALIVE_HOURS"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

